name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            IMPORTANT: Complete the entire code review before ending this turn.

            Do not launch any Agent with run_in_background=true.
            All agents and subagents, including the 4 parallel review agents in step 4,
            must use run_in_background=false.

            "In parallel" in the code-review skill does not mean background execution.
            Run those review agents in the foreground, one at a time if necessary.

            Wait for every spawned agent to return its result before continuing.
            Do not end the turn with agents still running.
            Do not rely on wakeups, background completion notifications, or scheduled
            continuation to finish the review.

            Complete validation, filtering, summary, and GitHub comments in this same
            invocation.

            If agent delegation cannot complete synchronously, perform the remaining
            review directly before ending the turn.'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          show_full_output: true
