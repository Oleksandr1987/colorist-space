name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            Review pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            This is an automated review triggered for the current PR HEAD commit:
            ${{ github.event.pull_request.head.sha }}.

            IMPORTANT:
            Always perform a fresh review of the current PR state, even if Claude has
            already reviewed or commented on this pull request.

            Previous Claude comments must NOT cause the review to stop or be skipped.
            They are historical context only. Review the code as it exists at the
            current HEAD commit.

            Review the diff between the PR base branch and the current PR HEAD.

            Read and follow the repository's CLAUDE.md instructions.

            Focus on high-confidence, actionable issues introduced by this PR:
            - real bugs and regressions
            - CLAUDE.md violations
            - multi-user isolation and missing current_user scoping
            - Rails / ActiveRecord correctness
            - database constraints, callbacks, nested attributes, and indexes
            - N+1 queries and meaningful performance regressions
            - Turbo / Stimulus lifecycle issues and race conditions
            - Active Storage ownership, security, and orphaned attachments
            - authentication and authorization issues
            - Rails security issues
            - I18n regressions in both Ukrainian and English
            - background job idempotency where applicable
            - missing regression tests for bug fixes

            Do not report:
            - pre-existing issues unrelated to this PR
            - cosmetic or stylistic preferences
            - minor refactoring suggestions
            - issues a normal linter would catch
            - speculative problems without a concrete failure scenario
            - duplicate findings for the same root cause

            For every potential issue, verify it against the actual code and surrounding
            context before reporting it. Prefer a small number of high-confidence
            findings over speculative feedback.

            Do not launch background agents.
            Do not use run_in_background=true.
            Complete the entire review in this invocation.

            If you find issues, post one inline GitHub comment per unique issue using
            mcp__github_inline_comment__create_inline_comment with confirmed=true.

            Each inline comment should explain:
            - what is wrong
            - the concrete failure or regression it can cause
            - how it should be fixed

            If no issues are found, post a PR comment with:

            ## Code review — ${{ github.event.pull_request.head.sha }}

            No issues found. Checked for bugs, regressions, test coverage, and
            CLAUDE.md compliance.

            Do not finish without completing the review of the current HEAD commit.

          claude_args: '--allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"'

          show_full_output: true
