name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Perform a complete code review of pull request:
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            This workflow was triggered for the current PR HEAD:

            BASE SHA:
            ${{ github.event.pull_request.base.sha }}

            HEAD SHA:
            ${{ github.event.pull_request.head.sha }}

            IMPORTANT:
            This is a new independent review run for the current HEAD commit.

            Always review the current PR state from BASE SHA through HEAD SHA.

            Do not skip the review because:
            - Claude previously reviewed this PR
            - Claude previously posted comments
            - an earlier commit in this PR was reviewed
            - some changed files were reviewed previously

            Previous review comments are historical context only.

            Review the complete diff:

              ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Do not review only the latest commit.

            Read and follow all applicable CLAUDE.md instructions before
            evaluating the changed code.

            First inspect the complete PR diff and identify every changed file.
            Then review all relevant changed files before posting findings.

            Focus on high-confidence, actionable issues introduced by this PR:

            - real bugs and regressions
            - CLAUDE.md violations
            - multi-user isolation and missing current_user scoping
            - Rails / ActiveRecord correctness
            - database constraints, callbacks, nested attributes, and indexes
            - N+1 queries and meaningful performance regressions
            - Turbo / Stimulus lifecycle issues and race conditions
            - Active Storage ownership, security, and orphaned attachments
            - authentication and authorization issues
            - Rails security issues
            - I18n regressions in both Ukrainian and English
            - background job idempotency where applicable
            - missing regression tests for bug fixes

            Do not report:

            - pre-existing issues unrelated to this PR
            - cosmetic or stylistic preferences
            - minor refactoring suggestions
            - issues a normal linter would catch
            - speculative problems without a concrete failure scenario
            - duplicate findings for the same root cause

            For every potential issue:
            1. Verify it against the actual current code.
            2. Read enough surrounding code to confirm the failure scenario.
            3. Check whether the issue is already handled elsewhere.
            4. Report it only when it is a high-confidence issue introduced by
               this PR.

            Do not stop after finding the first issue.

            Continue reviewing the remaining changed files after every finding.

            Complete the review of the entire PR diff before finishing.

            Do not launch background agents.
            Do not use run_in_background=true.

            If you find issues, post one inline GitHub comment per unique issue
            using mcp__github_inline_comment__create_inline_comment with
            confirmed=true.

            Each inline comment must explain:
            - what is wrong
            - the concrete failure or regression
            - how it should be fixed

            If no issues are found, post a PR comment containing:

            ## Code review — ${{ github.event.pull_request.head.sha }}

            No issues found. Checked the complete PR diff for bugs,
            regressions, test coverage, and CLAUDE.md compliance.

            Before finishing, verify that the reviewed HEAD SHA is exactly:

            ${{ github.event.pull_request.head.sha }}

          claude_args: >-
            --allowedTools
            "Read,Glob,Grep,
            Bash(gh pr view:*),
            Bash(gh pr diff:*),
            Bash(gh pr comment:*),
            Bash(git diff:*),
            Bash(git log:*),
            Bash(git blame:*),
            Bash(git status:*),
            Bash(git rev-parse:*),
            mcp__github_inline_comment__create_inline_comment"

          show_full_output: true
