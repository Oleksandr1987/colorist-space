
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_0900_as_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("MYSQL_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("MYSQL_PORT", 3306) %>
  username: <%= ENV.fetch("MYSQL_USERNAME", "colorist") %>
  password: <%= ENV.fetch("MYSQL_PASSWORD") %>

development:
  <<: *default
  database: colorist_development

test:
  <<: *default
  database: colorist_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("MYSQL_DATABASE", "colorist_production") %>

  cache:
    <<: *default
    database: <%= ENV.fetch("MYSQL_CACHE_DATABASE", "colorist_production_cache") %>
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: <%= ENV.fetch("MYSQL_QUEUE_DATABASE", "colorist_production_queue") %>
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: <%= ENV.fetch("MYSQL_CABLE_DATABASE", "colorist_production_cable") %>
    migrations_paths: db/cable_migrate
